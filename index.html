<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你的理想恋爱剧本</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root{
  --bg:#f3f0f8; --paper:#faf8fc; --card:#ffffff;
  --ink:#2d2a35; --soft:#5f5a6c; --faint:#9c94ad;
  --violet:#9a8fc9; --violet-deep:#6f63a0; --violet-soft:#ece3f3;
  --pink:#c98fb0; --pink-soft:#f6e8f0;
  --line:#e7dfee; --radius:24px; --shadow:0 12px 34px rgba(100,80,140,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1100px 680px at 85% -10%, rgba(201,143,176,.16), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(154,143,201,.16), transparent 55%),
    var(--bg);
  color:var(--ink); min-height:100vh; line-height:1.6;
}
.wrap{max-width:640px;margin:0 auto;padding:0 18px;}
.view{display:none;animation:fadeIn .45s ease both;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

#home{min-height:100vh;padding:40px 0;}
#home.active{display:flex;flex-direction:column;justify-content:center;}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:42px 30px 34px;position:relative;overflow:hidden;}
.hero .blob{position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(10px);opacity:.5;}
.hero .blob.b1{background:var(--violet-soft);top:-60px;right:-50px;}
.hero .blob.b2{background:var(--pink-soft);bottom:-70px;left:-60px;}
.hero .inner{position:relative;}
.hero .kicker{letter-spacing:.3em;font-size:12px;color:var(--violet-deep);margin-bottom:18px;}
.hero h1{font-weight:900;font-size:30px;line-height:1.4;margin-bottom:16px;}
.hero h1 .hl{color:var(--violet-deep);}
.hero p.desc{color:var(--soft);font-size:15px;margin-bottom:26px;}
.tag-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px;}
.tag{font-size:13px;color:var(--violet-deep);background:var(--violet-soft);border-radius:999px;padding:6px 14px;}
.meta-row{display:flex;gap:18px;padding:16px 0 26px;border-top:1px dashed var(--line);}
.meta-row .m{flex:1;text-align:center;}
.meta-row .m b{display:block;font-size:22px;color:var(--violet-deep);}
.meta-row .m span{font-size:12px;color:var(--faint);}
.btn{display:block;width:100%;border:none;cursor:pointer;font-family:inherit;font-size:17px;font-weight:700;letter-spacing:.14em;color:#fff;background:linear-gradient(135deg,var(--violet),var(--violet-deep));padding:17px 20px;border-radius:18px;box-shadow:0 12px 24px rgba(111,99,160,.3);transition:transform .18s ease,box-shadow .18s ease;}
.btn:active{transform:translateY(2px);}
.btn.ghost{background:transparent;color:var(--violet-deep);border:1.5px solid var(--violet);box-shadow:none;margin-top:14px;}
.disclaimer{margin-top:22px;text-align:center;font-size:12px;color:var(--faint);}

#quiz{padding:28px 0 40px;}
.quiz-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.quiz-head .step{font-size:14px;color:var(--soft);white-space:nowrap;font-weight:500;}
.progress{flex:1;height:9px;background:#eae3f0;border-radius:999px;overflow:hidden;}
.progress i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--violet));transition:width .4s ease;}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 24px 24px;margin-top:10px;}
.q-index{font-size:12px;letter-spacing:.25em;color:var(--pink);margin-bottom:12px;}
.q-title{font-size:21px;font-weight:700;line-height:1.55;margin-bottom:24px;}
.opts{display:flex;flex-direction:column;gap:14px;}
.opt{display:flex;gap:14px;align-items:flex-start;cursor:pointer;border:1.5px solid var(--line);border-radius:18px;padding:16px;background:var(--paper);transition:all .18s ease;}
.opt:hover{border-color:var(--violet);}
.opt .badge{flex:0 0 30px;height:30px;border-radius:10px;background:#eee7f1;color:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
.opt .txt{font-size:15.5px;color:var(--ink);}
.opt.selected{border-color:var(--violet);background:var(--violet-soft);}
.opt.selected .badge{background:var(--violet);color:#fff;}
.quiz-foot{display:flex;gap:12px;margin-top:22px;}
.quiz-foot .btn{flex:1;}
.btn-back{flex:0 0 48px;border:1.5px solid var(--line);background:var(--card);border-radius:18px;color:var(--soft);font-size:18px;cursor:pointer;}
.q-card.enter{animation:qIn .38s ease both;}
@keyframes qIn{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:translateX(0);}}

#result{padding:30px 0 50px;}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;}
.result-banner{padding:40px 26px 30px;text-align:center;color:#fff;}
.result-banner .r-kicker{letter-spacing:.28em;font-size:12px;opacity:.9;margin-bottom:14px;}
.result-banner .r-avatar{width:84px;height:84px;margin:0 auto 16px;border-radius:28px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;}
.result-banner .r-name{font-size:28px;font-weight:900;letter-spacing:.06em;}
.result-banner .r-cat{margin-top:8px;font-size:14px;opacity:.92;}
.r-quote{margin:0 26px;padding:22px 20px;background:var(--pink-soft);border-left:3px solid var(--pink);border-radius:0 16px 16px 0;font-size:17px;font-weight:500;color:var(--ink);margin-top:24px;}
.r-body{padding:26px 26px 10px;}
.r-block{margin-bottom:24px;}
.r-block h3{font-size:16px;color:var(--violet-deep);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.r-block h3::before{content:"";width:8px;height:8px;background:var(--pink);border-radius:3px;transform:rotate(45deg);}
.r-block p{font-size:15px;color:var(--soft);}
.trait-list{display:flex;flex-wrap:wrap;gap:10px;}
.trait-list span{background:var(--violet-soft);color:var(--violet-deep);border-radius:999px;padding:7px 14px;font-size:13.5px;}
.egg{background:var(--paper);border:1px dashed var(--pink);border-radius:16px;padding:16px 18px;font-size:14px;color:var(--pink);}
.bars{display:flex;flex-direction:column;gap:12px;}
.bar-row{display:flex;align-items:center;gap:12px;}
.bar-row .bl{flex:0 0 70px;font-size:13px;color:var(--soft);}
.bar-row .bt{flex:1;height:9px;background:#ece5f0;border-radius:999px;overflow:hidden;}
.bar-row .bt i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--violet));}
.bar-row .bv{flex:0 0 30px;text-align:right;font-size:12px;color:var(--faint);}
.r-note{font-size:12px;color:var(--faint);margin-top:8px;}
.result-actions{padding:0 26px 30px;}
.share-tip{text-align:center;font-size:12px;color:var(--faint);margin:18px 0 0;}

@media (max-width:480px){
  .hero{padding:32px 22px 26px;}
  .hero h1{font-size:25px;}
  .q-card{padding:24px 18px 18px;}
  .q-title{font-size:19px;}
  .result-banner .r-name{font-size:24px;}
  .r-body{padding:22px 20px 8px;}
  .result-actions{padding:0 20px 26px;}
}
</style>
</head>
<body>
<div class="wrap">

  <section id="home" class="view active">
    <div class="hero">
      <div class="blob b1"></div><div class="blob b2"></div>
      <div class="inner">
        <div class="kicker">恋 爱 剧 本 向 往 测 算</div>
        <h1>你的理想<br><span class="hl">恋爱剧本</span></h1>
        <p class="desc">从向往的开场、约会方式、相处节奏、冲突和解到未来想象，看看你骨子里最想要一段怎样的恋爱故事。</p>
        <div class="tag-row">
          <span class="tag">青梅竹马</span><span class="tag">双向奔赴</span><span class="tag">欢喜冤家</span>
          <span class="tag">细水长流</span><span class="tag">浪漫童话</span><span class="tag">并肩打拼</span><span class="tag">灵魂伴侣</span>
        </div>
        <div class="meta-row">
          <div class="m"><b>40</b><span>道情境选择题</span></div>
          <div class="m"><b>7</b><span>类恋爱剧本</span></div>
          <div class="m"><b>3</b><span>分钟左右</span></div>
        </div>
        <button type="button" class="btn" onclick="startQuiz()">开 始 测 试</button>
        <p class="disclaimer">本测试为趣味恋爱想象，不代表真实择偶标准，不构成心理诊断或婚恋建议。</p>
      </div>
    </div>
  </section>

  <section id="quiz" class="view">
    <div class="quiz-head">
      <span class="step" id="stepText">1 / 40</span>
      <div class="progress"><i id="barFill"></i></div>
    </div>
    <div class="q-card" id="qCard">
      <div class="q-index" id="qIndex">第 1 题</div>
      <div class="q-title" id="qTitle"></div>
      <div class="opts" id="opts"></div>
    </div>
    <div class="quiz-foot">
      <button type="button" class="btn-back" id="btnBack" onclick="prevQ()">←</button>
      <button type="button" class="btn" id="btnNext" onclick="nextQ()">下一题</button>
    </div>
  </section>

  <section id="result" class="view">
    <div class="result-card" id="resultCard"></div>
    <div class="result-actions">
      <button type="button" class="btn ghost" onclick="restart()">再 测 一 次</button>
      <p class="share-tip">截图保存本页，看看你的理想恋爱剧本。</p>
    </div>
  </section>

</div>

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
const $ = id => document.getElementById(id);

function showView(name){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $(name).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}
function startQuiz(){ current=0; answers=new Array(QUESTIONS.length).fill(null); showView("quiz"); renderQ(false); }
function renderQ(animate=true){
  const q=QUESTIONS[current];
  $("stepText").textContent=(current+1)+" / "+QUESTIONS.length;
  $("barFill").style.width=(current/QUESTIONS.length*100)+"%";
  $("qIndex").textContent="第 "+(current+1)+" 题";
  $("qTitle").textContent=q.q;
  const box=$("opts"); box.innerHTML="";
  const letters=["A","B","C","D"];
  q.options.forEach((op,i)=>{
    const div=document.createElement("div");
    div.className="opt"+(answers[current]===i?" selected":"");
    div.innerHTML=`<div class="badge">${letters[i]}</div><div class="txt">${op.t}</div>`;
    div.onclick=()=>selectOption(i);
    box.appendChild(div);
  });
  $("btnNext").textContent=current===QUESTIONS.length-1?"查看结果":"下一题";
  $("btnBack").style.visibility=current===0?"hidden":"visible";
  if(animate){const card=$("qCard");card.classList.remove("enter");void card.offsetWidth;card.classList.add("enter");}
}
function selectOption(i){ answers[current]=i; [...$("opts").children].forEach((el,idx)=>el.classList.toggle("selected",idx===i)); }
function nextQ(){
  if(answers[current]===null){ $("qCard").animate([{transform:"translateX(0)"},{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}],{duration:300}); return; }
  if(current<QUESTIONS.length-1){current++;renderQ();}else{finish();}
}
function prevQ(){ if(current>0){current--;renderQ();} }

function calcScores(){
  const scores={}; Object.keys(DIMS).forEach(k=>scores[k]=0);
  answers.forEach((ans,qi)=>{ if(ans===null)return; scores[QUESTIONS[qi].options[ans].d]+=3; });
  return scores;
}
function pickPersona(scores){ const order=Object.keys(PERSONAS);let best=order[0]; order.forEach(k=>{if(scores[k]>scores[best])best=k;}); return best; }
function finish(){ const scores=calcScores(); renderResult(pickPersona(scores),scores); showView("result"); }
function renderResult(key,scores){
  const p=PERSONAS[key]; const max=Math.max(1,...Object.values(scores));
  const bars=Object.keys(DIMS).map(k=>{const w=Math.round(scores[k]/max*100);return `<div class="bar-row"><div class="bl">${DIMS[k].label}</div><div class="bt"><i style="width:${w}%"></i></div><div class="bv">${scores[k]}</div></div>`;}).join("");
  $("resultCard").innerHTML=`
    <div class="result-banner" style="background:${p.banner}">
      <div class="r-avatar">${p.avatar}</div>
      <div class="r-kicker">你 的 理 想 恋 爱 剧 本</div>
      <div class="r-name">${p.name}</div>
      <div class="r-cat">${p.title} · 与你高度契合</div>
    </div>
    <div class="r-quote">${p.quote}</div>
    <div class="r-body">
      <div class="r-block"><h3>剧本画像</h3><div class="trait-list">${p.traits.map(t=>`<span>${t}</span>`).join("")}</div></div>
      <div class="r-block"><h3>剧本设定与走向</h3><p>${p.reason}</p></div>
      <div class="r-block"><h3>高甜场景</h3><div class="trait-list">${p.scenes.map(t=>`<span>${t}</span>`).join("")}</div></div>
      <div class="r-block"><h3>角色分工参考</h3><div class="trait-list">${p.careers.map(t=>`<span>${t}</span>`).join("")}</div><p class="r-note">* 剧本类型仅为趣味想象，不构成真实择偶标准。</p></div>
      <div class="r-block"><h3>避雷提示</h3><p>${p.hidden}</p></div>
      <div class="r-block"><h3>趣味彩蛋</h3><div class="egg">${p.egg}</div></div>
      <div class="r-block"><h3>你的七维画像</h3><div class="bars">${bars}</div></div>
    </div>`;
}
function restart(){ showView("home"); }
